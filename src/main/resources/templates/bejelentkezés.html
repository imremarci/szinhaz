<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Bejelentkezés</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="theater-title">Zsiráf Színház</h1>
        
        <!-- Később ide jöhet a Thymeleaf form akció: th:action="@{/login}" method="post" -->
        <form>
            <div class="mb-4">
                <label for="username" class="form-label"><i class="bi bi-person-fill me-2"></i>Felhasználónév</label>
                <!-- A név mező -->
                <input type="text" class="form-control" id="username" name="username" placeholder="Add meg a felhasználóneved" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Jelszó</label>
                <!-- A type="password" miatt pontok lesznek a betűk helyett -->
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-gold w-100">Belépés</button>
        </form>

        <div class="auth-link">
            Még nincs fiókod? <br>
            <!-- A link később a regisztrációs végpontra mutat majd -->
            <a href="/regisztracio" th:href="@{/regisztracio}">Regisztrálj itt!</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
