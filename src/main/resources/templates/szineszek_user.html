<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Társulat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='/főoldal'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='/darabok'|">Színdarabok</h2>
                    <h2 class="active" th:onclick="|window.location.href='/szineszek'|">Színészek</h2>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            <div class="top-bar">
                <h3 class="page-title">Társulatunk</h3>
            </div>

            <div class="px-4 pb-5">
                <!-- 4 OSZLOPOS RÁCS: row-cols-lg-4 -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                    
                    <!-- 1. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 1">
                            <div class="actor-info">
                                <h4 class="actor-name">Nagy Ervin</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 4.9</div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 2">
                            <div class="actor-info">
                                <h4 class="actor-name">Ónodi Eszter</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 4.8</div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 3">
                            <div class="actor-info">
                                <h4 class="actor-name">Mácsai Pál</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 5.0</div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 4">
                            <div class="actor-info">
                                <h4 class="actor-name">Tenki Réka</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 4.7</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
