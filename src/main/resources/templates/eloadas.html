<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Jegyvásárlás</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Közös CSS fájl bekötése -->
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/fooldal}'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='@{/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/szineszek}'|">Színészek</h2>
                    <h2 class="active" th:onclick="|window.location.href='@{/eloadasok}'|">Előadások</h2>
                </div>
                <div class="sidebar-giraffe" aria-hidden="true"></div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">

            <!-- Fejléc Vissza gombbal -->
            <div class="top-bar">
                <a href="/eloadasok" th:href="@{/eloadasok}" class="text-decoration-none">
                    <button class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Vissza a műsorhoz</button>
                </a>
                <h3 class="page-title m-0">Helyfoglalás</h3>
            </div>

            <div class="px-4 pb-5">
                <div class="row g-4 align-items-stretch">

                    <!-- BAL OLDAL (50% - col-lg-6): Darab adatai és összegzés -->
                    <div class="col-12 col-lg-6">
                        <div class="ticket-info-panel h-100 d-flex flex-column justify-content-between">
                            <div>
                                <h2 class="ticket-play-title" th:text="${show.play.title}">A dzsungel könyve</h2>
                                <div class="ticket-date-time">
                                    <i class="bi bi-calendar-event me-2"></i>
                                    <span th:text="${#temporals.format(show.startTime, 'yyyy. MMM dd.')}">2026. Nov 05.</span> <br>
                                    <i class="bi bi-clock me-2 mt-2 d-inline-block"></i>
                                    <span th:text="${#temporals.format(show.startTime, 'HH:mm')}">19:00</span>
                                </div>

                                <p class="text-secondary">
                                    Játszóhely: <strong th:text="${show.room.name}">Zsiráf Teátrum, Nagyterem</strong><br>
                                    Rendező: <span th:text="${show.play.director}">Rendező neve</span>
                                </p>
                            </div>

                            <!-- Kiválasztott jegyek összegzése -->
                            <div class="ticket-summary mt-4">
                                <h5 class="text-white mb-3">Kiválasztott helyek</h5>
                                <div id="selected-seats-list" class="text-secondary mb-3">
                                    <em>Még nem választottál ki helyet. Kattints a nézőtéren a szabad székekre!</em>
                                </div>
                                <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3 mt-3 mb-4">
                                    <span class="text-white">Fizetendő:</span>
                                    <strong class="text-warning fs-4">0 Ft</strong>
                                </div>

                                <!-- EZ AZ EGYETLEN FORM KÜLDI EL AZ ADATOKAT A KOSÁRNAK -->
                                <form th:action="@{/kosar/hozzaad}" method="post" id="addToCartForm">
                                    <input type="hidden" name="showId" th:value="${show.id}">
                                    <input type="hidden" name="selectedSeats" id="selectedSeatsInput">
                                    <button type="submit" class="btn btn-gold w-100" disabled id="btn-checkout">KOSÁRBA TESZEM</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- JOBB OLDAL (50% - col-lg-6): Grafikus nézőtér -->
                    <div class="col-12 col-lg-6">
                        <div class="ticket-seat-map h-100 d-flex flex-column justify-content-between align-items-center">

                            <!-- Színpad -->
                            <div class="stage-large w-100">SZÍNPAD</div>

                            <!-- Ülésrend (Nézőtér) -->
                            <div class="auditorium-large my-4">

                                <!-- 1. NAGYTEREM (10 sor, 15 szék) -->
                                <!-- Elrendezés: 4 szék | folyosó | 7 szék | folyosó | 4 szék -->
                                <th:block th:if="${#strings.containsIgnoreCase(show.room.name, 'Nagyterem') or #strings.containsIgnoreCase(show.room.name, 'terem 1')}">
                                    <div class="seat-row-large" th:each="r : ${#numbers.sequence(1, show.room.numberOfRows)}">
                                        <div class="row-number" th:text="${r} + '.'">1.</div>

                                        <!-- Bal blokk (1-4. szék) -->
                                        <th:block th:each="s : ${#numbers.sequence(1, 4)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>

                                        <div class="ms-2"></div> <!-- Bal folyosó -->

                                        <!-- Középső blokk (5-11. szék) -->
                                        <th:block th:each="s : ${#numbers.sequence(5, 11)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>

                                        <div class="ms-2"></div> <!-- Jobb folyosó -->

                                        <!-- Jobb blokk (12-15. szék) -->
                                        <th:block th:each="s : ${#numbers.sequence(12, 15)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>
                                    </div>
                                </th:block>

                                <!-- 2. KAMARATEREM (8 sor, 10 szék) -->
                                <!-- Elrendezés: 5 szék | folyosó | 5 szék -->
                                <th:block th:if="${#strings.containsIgnoreCase(show.room.name, 'Kamaraterem') or #strings.containsIgnoreCase(show.room.name, 'terem 2')}">
                                    <div class="seat-row-large" th:each="r : ${#numbers.sequence(1, show.room.numberOfRows)}">
                                        <div class="row-number" th:text="${r} + '.'">1.</div>

                                        <!-- Bal blokk (1-5. szék) -->
                                        <th:block th:each="s : ${#numbers.sequence(1, 5)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>

                                        <div class="ms-3"></div> <!-- Folyosó -->

                                        <!-- Jobb blokk (6-10. szék) -->
                                        <th:block th:each="s : ${#numbers.sequence(6, 10)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>
                                    </div>
                                </th:block>

                                <!-- 3. STÚDIÓTEREM (7 sor, 8 szék) -->
                                <!-- Elrendezés: 8 szék egyben -->
                                <th:block th:if="${#strings.containsIgnoreCase(show.room.name, 'Stúdió') or #strings.containsIgnoreCase(show.room.name, 'Studio') or #strings.containsIgnoreCase(show.room.name, 'terem 3')}">
                                    <div class="seat-row-large" th:each="r : ${#numbers.sequence(1, show.room.numberOfRows)}">
                                        <div class="row-number" th:text="${r} + '.'">1.</div>

                                        <!-- 8 szék folyamatosan -->
                                        <th:block th:each="s : ${#numbers.sequence(1, 8)}">
                                            <div class="seat-large" th:classappend="${bookedSeats != null and #lists.contains(bookedSeats, r + '-' + s)} ? 'taken' : ''" th:data-row="${r}" th:data-seat="${s}" onclick="toggleSeat(this)"></div>
                                        </th:block>
                                    </div>
                                </th:block>

                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS a székek kattintásához -->
<script>
    const ticketPrice = 4500; // Egy jegy ára

    function toggleSeat(seatElement) {
        if (seatElement.classList.contains('taken')) return;

        seatElement.classList.toggle('selected');

        const selectedSeats = document.querySelectorAll('.seat-large.selected');
        const selectedCount = selectedSeats.length;

        const listDiv = document.getElementById('selected-seats-list');
        const priceDiv = document.querySelector('.text-warning.fs-4');
        const btnCheckout = document.getElementById('btn-checkout');
        const hiddenInput = document.getElementById('selectedSeatsInput');

        if (selectedCount > 0) {
            // Összegyűjtjük a székek sor- és székszámát
            let seatData = [];
            selectedSeats.forEach(seat => {
                seatData.push(seat.getAttribute('data-row') + '-' + seat.getAttribute('data-seat'));
            });

            // Beírjuk a rejtett inputba, amit a form elküld
            hiddenInput.value = seatData.join(',');

            listDiv.innerHTML = `<span class="text-white">${selectedCount} db</span> jegy kiválasztva.`;
            priceDiv.innerText = (selectedCount * ticketPrice).toLocaleString('hu-HU') + ' Ft';
            btnCheckout.removeAttribute('disabled');
        } else {
            hiddenInput.value = '';
            listDiv.innerHTML = '<em>Még nem választottál ki helyet. Kattints a nézőtéren a szabad székekre!</em>';
            priceDiv.innerText = '0 Ft';
            btnCheckout.setAttribute('disabled', 'true');
        }
    }
</script>
</body>
</html>
