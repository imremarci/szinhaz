<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Társulat (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='/főoldal'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='/darabok'|">Színdarabok</h2>
                    <h2 class="active" th:onclick="|window.location.href='/szineszek'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='/termek'|">Termek</h2>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            <div class="top-bar">
                <h3 class="page-title">Társulat Kezelése (Admin)</h3>
            </div>

            <div class="px-4 pb-5">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                    
                    <!-- 1. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 1">
                            <div class="actor-info">
                                <h4 class="actor-name">Nagy Ervin</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 4.9</div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Színész -->
                    <div class="col">
                        <div class="actor-card">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész 2">
                            <div class="actor-info">
                                <h4 class="actor-name">Ónodi Eszter</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> 4.8</div>
                            </div>
                        </div>
                    </div>

                    <!-- ADMIN GOMB: ÚJ SZÍNÉSZ HOZZÁADÁSA -->
                    <!-- Beletesszük a már meglévő add-new-card dizájnt egy oszlopba -->
                    <div class="col">
                        <div class="add-new-card h-100 m-0" data-bs-toggle="modal" data-bs-target="#addActorModal" style="min-height: 250px;">
                            <div class="add-new-content">
                                <i class="bi bi-person-plus-fill"></i>
                                <h3 class="mt-2">Új Színész</h3>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: ÚJ SZÍNÉSZ FELVÉTELE ŰRLAP -->
<div class="modal fade" id="addActorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content theater-modal">
            <form>
                <div class="modal-header theater-modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-badge-fill me-2"></i>Új Színész Felvétele</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                </div>
                
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label">Színész neve</label>
                        <input type="text" class="form-control" placeholder="Pl.: Kovács János" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Profilkép URL (Négyzetes)</label>
                        <input type="text" class="form-control" placeholder="https://..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Kezdő Értékelés</label>
                        <input type="number" step="0.1" min="1" max="5" class="form-control" value="5.0" required>
                    </div>
                </div>
                
                <div class="modal-footer theater-modal-footer">
                    <button type="button" class="btn btn-secondary text-uppercase fw-bold" data-bs-dismiss="modal">Mégse</button>
                    <button type="submit" class="btn btn-gold">Társulathoz ad</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
