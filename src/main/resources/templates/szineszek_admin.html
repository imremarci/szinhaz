<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Társulat (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI ADMIN MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar d-flex flex-column" style="min-height: 100vh;">
                <h1>Zsiráf Színház</h1>

                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/admin/darabok}'|">Színdarabok</h2>
                    <h2 class="active" th:onclick="|window.location.href='@{/admin/szineszek}'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='@{/admin}'|">Termek / Idősáv</h2>
                </div>

                <div class="mt-auto p-3 border-top border-secondary">
                    <a th:href="@{/kijelentkezes}" class="btn btn-outline-danger w-100 fw-bold">
                        <i class="bi bi-box-arrow-left me-2"></i>Kijelentkezés
                    </a>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">

            <div class="top-bar">
                <h3 class="page-title">Társulat Kezelése (Admin)</h3>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Hibaüzenet</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}">Sikeres művelet!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <div class="px-4 pb-5">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                    
                    <!-- SZÍNÉSZEK AZ ADATBÁZISBÓL -->
                    <div class="col" th:each="actor : ${actors}">
                        <div class="actor-card">
                            <button type="button" class="actor-edit-btn"
                                    th:data-actor-id="${actor.id}"
                                    th:data-name="${actor.name}"
                                    th:data-image="${actor.profileImageUrl}"
                                    th:data-rating="${actor.rating}"
                                    onclick="openEditActorModal(this)"
                                    title="Színész szerkesztése"
                                    aria-label="Színész szerkesztése">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <img th:src="${actor.profileImageUrl}" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&h=400&fit=crop" class="actor-image" alt="Színész">
                            <div class="actor-info">
                                <h4 class="actor-name" th:text="${actor.name}">Nagy Ervin</h4>
                                <div class="actor-rating"><i class="bi bi-star-fill"></i> <span th:text="${actor.rating}">4.9</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- ADMIN GOMB: ÚJ SZÍNÉSZ HOZZÁADÁSA -->
                    <div class="col">
                        <div class="add-new-card h-100 m-0" data-bs-toggle="modal" data-bs-target="#addActorModal" style="min-height: 250px;">
                            <div class="add-new-content">
                                <i class="bi bi-person-plus-fill"></i>
                                <h3 class="mt-2">Új Színész</h3>
                            </div>
                        </div>
                    </div>
                    <!-- MODAL: MEGLÉVŐ SZÍNÉSZ SZERKESZTÉSE -->
                    <div class="modal fade" id="editActorModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content theater-modal">
                                <form th:action="@{/admin/szineszek/mentes}" method="post">
                                    <input type="hidden" id="editActorId" name="id">
                                    <div class="modal-header theater-modal-header">
                                        <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Színész Szerkesztése</h5>
                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                                    </div>

                                    <div class="modal-body p-4">
                                        <div class="mb-3">
                                            <label class="form-label">Színész neve</label>
                                            <input type="text" id="editActorName" name="name" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Profilkép URL (Négyzetes)</label>
                                            <input type="text" id="editActorImage" name="profileImageUrl" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Értékelés</label>
                                            <input type="number" id="editActorRating" name="rating" step="0.1" min="1" max="5" class="form-control" required>
                                        </div>
                                    </div>

                                    <div class="modal-footer theater-modal-footer">
                                        <button type="button" class="btn btn-secondary text-uppercase fw-bold" data-bs-dismiss="modal">Mégse</button>
                                        <button type="submit" class="btn btn-gold">Módosítások mentése</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: ÚJ SZÍNÉSZ FELVÉTELE ŰRLAP BEKÖTVE -->
<div class="modal fade" id="addActorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content theater-modal">
            <form th:action="@{/admin/szineszek/mentes}" method="post">
                <div class="modal-header theater-modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-badge-fill me-2"></i>Új Színész Felvétele</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                </div>
                
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label">Színész neve</label>
                        <input type="text" name="name" class="form-control" placeholder="Pl.: Kovács János" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Profilkép URL (Négyzetes)</label>
                        <input type="text" name="profileImageUrl" class="form-control" placeholder="https://..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Kezdő Értékelés</label>
                        <input type="number" name="rating" step="0.1" min="1" max="5" class="form-control" value="5.0" required>
                    </div>
                </div>
                
                <div class="modal-footer theater-modal-footer">
                    <button type="button" class="btn btn-secondary text-uppercase fw-bold" data-bs-dismiss="modal">Mégse</button>
                    <button type="submit" class="btn btn-gold">Társulathoz ad</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let editActorModalInstance;

    function openEditActorModal(button) {
        document.getElementById('editActorId').value = button.dataset.actorId;
        document.getElementById('editActorName').value = button.dataset.name || '';
        document.getElementById('editActorImage').value = button.dataset.image || '';
        document.getElementById('editActorRating').value = button.dataset.rating;

        if (!editActorModalInstance) {
            editActorModalInstance = new bootstrap.Modal(document.getElementById('editActorModal'));
        }
        editActorModalInstance.show();
    }
</script>
</body>
</html>
