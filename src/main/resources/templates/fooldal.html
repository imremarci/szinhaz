<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Főoldal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar d-flex flex-column" style="min-height: 100vh;">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 class="active" th:onclick="|window.location.href='@{/fooldal}'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='@{/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/szineszek}'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='@{/eloadasok}'|">Előadások</h2>
                </div>

                <!-- Csak bejelentkezve látszik -->
                <div th:if="${session.loggedInUser != null}" class="mt-auto p-3 border-top border-secondary">
                    <a th:href="@{/kijelentkezes}" class="btn btn-outline-danger w-100 fw-bold">
                        <i class="bi bi-box-arrow-left me-2"></i>Kijelentkezés
                    </a>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">

            <!-- Fejléc (Bejelentkezés és Kosár) -->
            <div class="top-bar d-flex justify-content-end align-items-center">
                <div class="d-flex align-items-center justify-content-end gap-3 px-4 py-3">
                    <!-- Ha NINCS bejelentkezve -->
                    <a th:if="${session.loggedInUser == null}" th:href="@{/bejelentkezes}" class="btn btn-gold fw-bold">
                        <i class="bi bi-person-fill me-1"></i> BEJELENTKEZÉS
                    </a>

                    <!-- Ha BE VAN jelentkezve -->
                    <a th:if="${session.loggedInUser != null}" th:href="@{/profil}"
                       class="btn btn-outline-warning rounded-circle d-flex align-items-center justify-content-center"
                       style="width: 42px; height: 42px;"
                       th:title="${session.loggedInUser.name} + ' profilja'">
                        <i class="bi bi-person-fill fs-5"></i>
                    </a>

                    <!-- Kosár ikon -->
                    <a th:href="@{/kosar}" class="btn btn-outline-warning d-flex align-items-center justify-content-center"
                       style="width: 42px; height: 42px;" title="Kosár">
                        <i class="bi bi-cart3 fs-5"></i>
                    </a>
                </div>
            </div>

            <div class="px-4 pb-5">

                <!-- CAROUSEL (Adatbázisból generálva!) -->
                <h4 class="section-title">Kiemelt Előadásaink</h4>
                <div id="playCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#playCarousel"
                                th:each="play, iterStat : ${plays}"
                                th:data-bs-slide-to="${iterStat.index}"
                                th:classappend="${iterStat.first} ? 'active' : ''"></button>
                    </div>

                    <div class="carousel-inner">
                        <!-- Végigmegyünk a darabokon -->
                        <div class="carousel-item"
                             th:each="play, iterStat : ${plays}"
                             th:classappend="${iterStat.first} ? 'active' : ''"
                             th:onclick="|window.location.href='@{/darabok/{id}(id=${play.id})}'|"
                             style="cursor: pointer;">
                            <div class="carousel-overlay"></div>
                            <!-- Ha van borítóképe, beteszi háttérnek -->
                            <img th:src="${play.coverImageUrl}" class="d-block w-100" style="height: 300px; object-fit: cover;" alt="...">
                            <div class="carousel-caption">
                                <h3 th:text="${play.title}">Hamlet</h3>
                                <p class="mb-0" th:text="'Rendező: ' + ${play.director} + ' | Jegyek már kaphatók!'"></p>
                            </div>
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#playCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#playCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>

                <!-- IDŐSÁV (Adatbázisból generálva!) -->
                <h4 class="section-title">Mai Műsor (Idősáv)</h4>

                <div class="timeline-container">
                    <div class="timeline-row border-0 pb-2 mb-2">
                        <div class="timeline-label"></div>
                        <div class="position-relative flex-grow-1 text-secondary small fw-bold" style="height: 20px;">
                            <span th:each="h : ${#numbers.sequence(10, 22)}"
                                  th:text="${h} + ':00'"
                                  th:style="'position: absolute; left: ' + ${(h - 10) * 8.3333} + '%; transform: translateX(-50%);'">
                            </span>
                        </div>
                    </div>

                    <!-- Végigmegyünk az adatbázisban lévő ÖSSZES termen -->
                    <div class="timeline-row" th:each="room : ${rooms}">

                        <!-- A terem neve (pl. "Nagyterem") -->
                        <div class="timeline-label" th:text="${#strings.substringAfter(room.name, ', ')} ?: ${room.name}">Terem</div>

                        <!-- A szürke sáv, ami üresen is látszódni fog a min-height miatt -->
                        <div class="timeline-track" style="overflow: hidden; min-height: 45px; position: relative; background-color: #222; border-radius: 4px;">

                            <!-- Végigmegyünk a mai előadásokon -->
                            <th:block th:each="show : ${shows}">
                                <th:block th:if="${show != null and show.room != null and show.play != null and show.startTime != null}">

                                    <!-- Csak akkor rajzol blokkot, ha az előadás ebbe a terembe szól -->
                                    <th:block th:if="${show.room.name == room.name}">

                                        <div th:with="
                                startHour=${show.startTime.hour},
                                startMin=${show.startTime.minute},
                                duration=${show.play.durationMinutes != null ? show.play.durationMinutes : 120},
                                leftPos=${((startHour - 10) + (startMin / 60.0)) * 8.3333},
                                widthVal=${(duration / 60.0) * 8.3333}"
                                             th:class="'play-block ' + (${show.play.id % 3 == 0} ? 'play-green' : (${show.play.id % 2 == 0} ? 'play-blue' : 'play-red'))"
                                             th:style="'cursor: pointer; position: absolute; top: 0; left: ' + ${leftPos} + '%; width: ' + ${widthVal} + '%; height: 100%;'"
                                             th:title="${show.play.title}"
                                             th:onclick="|window.location.href='@{/eloadas/{id}(id=${show.id})}'|">

                                            <span class="play-title" th:text="${show.play.title} + ' (' + ${#temporals.format(show.startTime, 'HH:mm')} + '-' + ${#temporals.format(show.startTime.plusMinutes(show.play.durationMinutes != null ? show.play.durationMinutes : 120), 'HH:mm')} + ')'"></span>

                                        </div>

                                    </th:block>
                                </th:block>
                            </th:block>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
