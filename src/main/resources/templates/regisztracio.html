<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card large">
    <h1 class="theater-title">Zsiráf Színház</h1>
    <div class="page-subtitle">Csatlakozz a közönségünkhöz!</div>

    <!-- Hibaüzenet -->
    <div th:if="${error}" class="alert alert-danger text-center py-2 mb-3" th:text="${error}"></div>

    <form th:action="@{/regisztracio}" method="post">
        <div class="mb-4">
            <label for="fullName" class="form-label"><i class="bi bi-person-vcard me-2"></i>Teljes Név</label>
            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Pl.: Kovács János" required>
        </div>

        <div class="mb-4">
            <label for="email" class="form-label"><i class="bi bi-envelope-fill me-2"></i>E-mail cím</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Pl.: kovacs.janos@email.hu"
                   pattern="[^@\s]+@[^@\s]+\.[^@\s]{2,}"
                   title="Adj meg egy teljes e-mail címet ponttal és végződéssel (pl.: kovacs.janos@email.hu)!"
                   required>
        </div>

        <div class="mb-4">
            <label for="username" class="form-label"><i class="bi bi-person-fill me-2"></i>Felhasználónév</label>
            <input type="text" class="form-control" id="username" name="name" placeholder="Válassz egy egyedi nevet" minlength="3" required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Jelszó</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Pl.: Jelszo123!"
                   minlength="8"
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                   title="Legalább 8 karakter, benne kisbetű, nagybetű és szám. Írásjel opcionális."
                   required>
            <div class="form-text text-secondary">Legalább 8 karakter, benne kisbetű, nagybetű és szám. Írásjel opcionális.</div>
        </div>

        <button type="submit" class="btn btn-gold w-100">Regisztrálok</button>
    </form>

    <div class="auth-link">
        Már van fiókod? <br>
        <a href="/bejelentkezes" th:href="@{/bejelentkezes}">Lépj be itt!</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const emailInput = document.getElementById('email');

    emailInput.addEventListener('invalid', function () {
        const val = this.value.trim();

        if (val === '') {
            this.setCustomValidity('Az e-mail cím megadása kötelező!');
        } else if (!val.includes('@')) {
            this.setCustomValidity('Az e-mail címnek tartalmaznia kell egy „@” jelet!');
        } else if (val.endsWith('@')) {
            this.setCustomValidity('Add meg a „@” utáni részt is (pl.: email.hu)!');
        } else if (val.endsWith('.')) {
            this.setCustomValidity('Add meg a pont utáni végződést (pl.: hu, com)!');
        } else if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(val)) {
            this.setCustomValidity('Adj meg egy teljes e-mail címet ponttal és végződéssel (pl.: kovacs.janos@email.hu)!');
        }
    });

    emailInput.addEventListener('input', function () {
        this.setCustomValidity('');
    });
</script>
</body>
</html>
