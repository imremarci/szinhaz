<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Profilom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar d-flex flex-column" style="min-height: 100vh;">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/fooldal}'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='@{/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/szineszek}'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='@{/eloadasok}'|">Előadások</h2>
                </div>

                <div class="mt-auto p-3 border-top border-secondary">
                    <a th:href="@{/kijelentkezes}" class="btn btn-outline-danger w-100 fw-bold">
                        <i class="bi bi-box-arrow-left me-2"></i>Kijelentkezés
                    </a>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2 p-4">

            <!-- FELHASZNÁLÓ ADATAI -->
            <div class="card bg-dark border-warning mb-4">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center"
                         style="width: 64px; height: 64px;">
                        <i class="bi bi-person-fill fs-1"></i>
                    </div>
                    <div>
                        <small class="text-secondary text-uppercase fw-bold">Bejelentkezett felhasználó</small>
                        <h2 class="m-0 fw-bold" style="color: var(--theater-gold);" th:text="${user.name}">Felhasználónév</h2>
                    </div>
                </div>
            </div>

            <!-- MEGVÁSÁROLT JEGYEK -->
            <h4 class="fw-bold mb-3" style="color: var(--theater-gold); text-transform: uppercase; letter-spacing: 1.5px;">
                <i class="bi bi-ticket-perforated-fill me-2"></i>Megvásárolt jegyeim
            </h4>

            <div th:if="${#lists.isEmpty(tickets)}" class="alert alert-secondary bg-dark border-secondary text-light">
                Még nincs megvásárolt jegyed. Nézz szét az <a th:href="@{/eloadasok}" class="text-warning fw-bold">Előadások</a> között!
            </div>

            <div class="row g-3" th:unless="${#lists.isEmpty(tickets)}">
                <div class="col-12 col-md-6 col-lg-4" th:each="ticket : ${tickets}">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body">
                            <h5 class="card-title fw-bold" style="color: var(--theater-gold);"
                                th:text="${ticket.show.play.title}">Színdarab címe</h5>
                            <p class="card-text mb-1 text-light">
                                <i class="bi bi-calendar-event me-2 text-warning"></i>
                                <span th:text="${#temporals.format(ticket.show.startTime, 'yyyy. MM. dd. HH:mm')}">2026. 11. 19. 19:00</span>
                            </p>
                            <p class="card-text mb-1 text-light">
                                <i class="bi bi-geo-alt-fill me-2 text-warning"></i>
                                <span th:text="${ticket.show.room.name}">Nagyterem</span>
                            </p>
                            <p class="card-text mb-0 text-light">
                                <i class="bi bi-grid-3x3-gap-fill me-2 text-warning"></i>
                                <strong>Szék: </strong>
                                <span th:text="${ticket.rowNumber} + '. sor, ' + ${ticket.seatNumber} + '. szék'">1. sor, 4. szék</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
