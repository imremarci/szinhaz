<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Előadások</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/fooldal}'|">Főoldal</h2>
                    <h2 th:onclick="|window.location.href='@{/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/szineszek}'|">Színészek</h2>
                    <h2 class="active" th:onclick="|window.location.href='@{/eloadasok}'|">Előadások</h2>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            
            <div class="top-bar">
                <h3 class="page-title">Műsorfüzet</h3>
            </div>

            <div class="px-4 pb-5">
                
                <!-- ELŐADÁSOK LISTÁJA AZ ADATBÁZISBÓL -->
                <div class="schedule-list">

                    <div class="schedule-row" th:each="show : ${shows}">
                        <!-- Dátum a startTime mezőből -->
                        <div class="schedule-date">
                            <div class="sch-month" th:text="${#temporals.format(show.startTime, 'MMMM')}">November</div>
                            <div class="sch-day" th:text="${#temporals.format(show.startTime, 'd')}">5</div>
                            <div class="sch-weekday" th:text="${#temporals.format(show.startTime, 'EEEE')}">Csütörtök</div>
                            <div class="sch-time"><i class="bi bi-clock"></i> <span th:text="${#temporals.format(show.startTime, 'HH:mm')}">19:00</span></div>
                        </div>
                        
                        <!-- Részletek -->
                        <div class="schedule-details">
                            <div class="sch-title" th:text="${show.play.title}">A dzsungel könyve</div>
                            <div class="sch-subtitle" th:text="'Rendező: ' + ${show.play.director}">Rendező</div>
                            <div class="sch-location">Játszóhely: <span th:text="${show.room.name}">Zsiráf Teátrum, Nagyterem</span></div>
                        </div>

                        <!-- Gomb -->
                        <div class="schedule-action">
                            <div class="sch-category">Színházi előadás</div>
                            <a th:href="@{/eloadas/{id}(id=${show.id})}" class="text-decoration-none">
                                <button class="btn-ticket"><i class="bi bi-ticket-perforated-fill me-2"></i>Jegyvásárlás</button>
                            </a>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
