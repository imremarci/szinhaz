<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Színdarabok (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI ADMIN MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar d-flex flex-column" style="min-height: 100vh;">
                <h1>Zsiráf Színház</h1>

                <div class="sidebar-menu mt-4">
                    <h2 class="active" th:onclick="|window.location.href='@{/admin/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/admin/szineszek}'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='@{/admin}'|">Termek / Idősáv</h2>
                </div>

                <div class="mt-auto p-3 border-top border-secondary">
                    <a th:href="@{/kijelentkezes}" class="btn btn-outline-danger w-100 fw-bold">
                        <i class="bi bi-box-arrow-left me-2"></i>Kijelentkezés
                    </a>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">

            <div class="top-bar">
                <h3 class="page-title">Színdarabok Kezelése (Admin)</h3>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Hibaüzenet</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}">Sikeres művelet!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <div class="px-4 pb-5">
                
                <!-- SZÍNDARABOK LISTÁJA AZ ADATBÁZISBÓL -->
                <div class="play-card-item" th:each="play : ${plays}">
                    <img th:src="${play.coverImageUrl}" src="https://images.unsplash.com/photo-1585699324551-f6c309eedeca?q=80&w=250&h=300&fit=crop" class="play-image" alt="Borítókép">
                    <div class="play-content w-100">
                        <div class="d-flex justify-content-between align-items-start">
                            <h2 class="play-title-text" th:text="${play.title}">Hamlet</h2>
                            <form th:action="@{/admin/darabok/torles/{id}(id=${play.id})}" method="post">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash3"></i> Törlés</button>
                            </form>
                        </div>
                        <p class="play-desc">
                            <span th:text="${play.description}">Leírás...</span>
                            <a th:href="@{/darabok/{id}(id=${play.id})}" class="read-more">megtekintés</a>
                        </p>
                    </div>
                </div>

                <!-- ÚJ DARAB HOZZÁADÁSA GOMB -->
                <div class="add-new-card" data-bs-toggle="modal" data-bs-target="#addPlayModal">
                    <div class="add-new-content">
                        <i class="bi bi-plus-circle"></i>
                        <h3>Új színdarab hozzáadása</h3>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- MODAL: ÚJ DARAB FELVÉTELE ŰRLAP BEKÖTVE -->
<div class="modal fade" id="addPlayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content theater-modal">
            <form th:action="@{/admin/darabok/mentes}" method="post">
                <div class="modal-header theater-modal-header">
                    <h5 class="modal-title"><i class="bi bi-mask me-2"></i>Új Színdarab Rögzítése</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                </div>
                
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Színdarab címe</label>
                            <input type="text" name="title" class="form-control" placeholder="Pl.: Bánk Bán" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Hossz (perc)</label>
                            <input type="number" name="durationMinutes" class="form-control" placeholder="120" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Bemutató éve</label>
                            <input type="number" name="releaseYear" class="form-control" value="2026" required>
                        </div>
                        
                        <div class="col-12 mt-3">
                            <label class="form-label">Rendező neve</label>
                            <input type="text" name="director" class="form-control" placeholder="Pl.: Vidnyánszky Attila" required>
                        </div>
                        
                        <div class="col-12 mt-3">
                            <label class="form-label">Rövid leírás</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Miről szól a darab?" required></textarea>
                        </div>

                        <div class="col-12 mt-3">
                            <label class="form-label">Borítókép URL</label>
                            <input type="text" name="coverImageUrl" class="form-control" placeholder="https://..." required>
                        </div>
                        <div class="col-12 mt-3">
                            <label class="form-label">Szereplő színészek kiválasztása</label>
                            <div class="p-3 rounded border border-secondary bg-dark" style="max-height: 160px; overflow-y: auto;">
                                <div th:if="${#lists.isEmpty(actors)}" class="text-secondary small">
                                    Még nincsenek felvett színészek az adatbázisban.
                                </div>
                                <div class="form-check" th:each="actor : ${actors}">
                                    <input class="form-check-input" type="checkbox" name="actorIds"
                                           th:value="${actor.id}" th:id="'actor-' + ${actor.id}">
                                    <label class="form-check-label text-light" th:for="'actor-' + ${actor.id}"
                                           th:text="${actor.name}">
                                        Színész neve
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer theater-modal-footer">
                    <button type="button" class="btn btn-secondary text-uppercase fw-bold" data-bs-dismiss="modal">Mégse</button>
                    <button type="submit" class="btn btn-gold">Mentés az adatbázisba</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
