<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Admin Felület</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-3">
    <div class="row g-4">

        <!-- Bal oldali Admin Menü -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar d-flex flex-column" style="min-height: 100vh;">
                <h1>Zsiráf Színház</h1>

                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/admin/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/admin/szineszek}'|">Színészek</h2>
                    <h2 class="active" th:onclick="|window.location.href='@{/admin}'|">Termek / Idősáv</h2>
                </div>

                <div class="mt-auto p-3 border-top border-secondary">
                    <a th:href="@{/kijelentkezes}" class="btn btn-outline-danger w-100 fw-bold">
                        <i class="bi bi-box-arrow-left me-2"></i>Kijelentkezés
                    </a>
                </div>
            </div>
        </div>


        <!-- Jobb oldali fő tartalom -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2 d-flex flex-column justify-content-between">

            <div class="top-bar">
                <h3 class="page-title">Admin felület</h3>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Hibaüzenet</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show fw-bold mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}">Sikeres művelet!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
            </div>

            <!-- Felső rész: Dinamikus termek az adatbázisból -->
            <div class="row g-4 mt-1">
                <div class="col-12 col-md-4" th:each="room, stat : ${rooms}"
                     th:with="shortName=${#strings.contains(room.name, ', ') ? #strings.substringAfter(room.name, ', ') : room.name}">
                    <div class="room-card"
                         th:data-room-id="${room.id}"
                         th:data-room-name="${shortName}"
                         onclick="openModal(this)">
                        <div class="w-100 d-flex justify-content-between align-items-center mb-2">
                            <h4 class="fw-bold m-0" th:text="${shortName}">Terem neve</h4>
                            <span class="badge bg-gold" th:text="${stat.count} + '. terem'">1. terem</span>
                        </div>
                        <div class="stage">SZÍNPAD</div>
                        <div class="auditorium" th:id="'seats-room-' + ${stat.count}"></div>
                        <small class="text-secondary mt-3" style="font-style: italic;">+ Kattints előadás felvételéhez</small>
                    </div>
                </div>
            </div>

            <!-- Alsó rész: Mai idősáv az adatbázisból -->
            <div class="mt-4 mb-2">
                <div class="d-flex justify-content-between align-items-end mb-3 px-2">
                    <h4 class="fw-bold m-0 ms-4" style="color: var(--theater-gold); text-transform: uppercase; letter-spacing: 2px;">Mai idősáv</h4>
                </div>

                <div class="timeline-container">
                    <div class="timeline-row border-0 pb-2 mb-2">
                        <div class="timeline-label"></div>
                        <div class="position-relative flex-grow-1 text-secondary small fw-bold" style="height: 20px;">
                            <span th:each="h : ${#numbers.sequence(10, 22)}"
                                th:text="${h} + ':00'"
                                th:style="'position: absolute; left: ' + ${(h - 10) * 8.3333} + '%; transform: translateX(-50%);'">
                            </span>
                        </div>
                    </div>
                    <div class="timeline-row" th:each="room : ${rooms}"
                         th:with="shortName=${#strings.contains(room.name, ', ') ? #strings.substringAfter(room.name, ', ') : room.name}">
                        <div class="timeline-label" th:text="${shortName}">Terem</div>
                        <div class="timeline-track" style="overflow: hidden; min-height: 45px; position: relative;">

                            <th:block th:each="show : ${shows}">
                                <th:block th:if="${show != null and show.room != null and show.play != null and show.startTime != null}">
                                    <th:block th:if="${show.room.id == room.id}">

                                        <div th:with="
                                                startHour=${show.startTime.hour},
                                                startMin=${show.startTime.minute},
                                                duration=${show.play.durationMinutes != null ? show.play.durationMinutes : 120},
                                                leftPos=${((startHour - 10) + (startMin / 60.0)) * 8.3333},
                                                widthVal=${(duration / 60.0) * 8.3333}"
                                             th:class="'play-block ' + (${show.play.id % 3 == 0} ? 'play-green' : (${show.play.id % 2 == 0} ? 'play-blue' : 'play-red'))"
                                             th:style="'position: absolute; top: 0; left: ' + ${leftPos} + '%; width: ' + ${widthVal} + '%; height: 100%;'"
                                             th:title="${show.play.title}">

                                            <span class="play-title"
                                                  th:text="${show.play.title} + ' (' + ${#temporals.format(show.startTime, 'HH:mm')} + '-' + ${#temporals.format(show.startTime.plusMinutes(show.play.durationMinutes != null ? show.play.durationMinutes : 120), 'HH:mm')} + ')'">
                                            </span>

                                            <form th:action="@{/admin/eloadas/torol/{id}(id=${show.id})}" method="post" style="display: inline;">
                                                <button type="submit" class="delete-play-btn" title="Előadás törlése"
                                                        onclick="return confirm('Biztosan törlöd ezt az előadást az adatbázisból?');">
                                                    <i class="bi bi-trash3-fill"></i>
                                                </button>
                                            </form>
                                        </div>

                                    </th:block>
                                </th:block>
                            </th:block>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap Modal új előadás felvételéhez (adatbázisba ment) -->
<div class="modal fade" id="addPlayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/eloadas/hozzaad}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle" style="color: var(--theater-gold);">Új előadás felvétele</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="selectedRoomId" name="roomId">

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-light">Színdarab kiválasztása</label>
                        <select class="form-select bg-dark text-light border-secondary" name="playId" required>
                            <option th:each="play : ${plays}"
                                    th:value="${play.id}"
                                    th:text="${play.title} + ' (' + ${play.durationMinutes != null ? play.durationMinutes : 120} + ' perc)'">
                                Színdarab
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-light">Dátum és kezdési időpont</label>
                        <input type="datetime-local" class="form-control bg-dark text-light border-secondary" id="startTimeInput" name="startTime" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Mégse</button>
                    <button type="submit" class="btn btn-gold">Előadás mentése</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let modalInstance;

    function renderSeats(containerId, rows, pattern) {
        const container = document.getElementById(containerId);
        if (!container) return;
        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'seat-row';

            pattern.forEach(item => {
                if (item === 'aisle') {
                    const aisle = document.createElement('div');
                    aisle.className = 'aisle';
                    rowDiv.appendChild(aisle);
                } else {
                    for (let s = 0; s < item; s++) {
                        const seat = document.createElement('div');
                        const isVip = (r < 2);
                        seat.className = `seat ${isVip ? 'vip' : ''}`;
                        rowDiv.appendChild(seat);
                    }
                }
            });
            container.appendChild(rowDiv);
        }
    }

    renderSeats('seats-room-1', 5, [2, 'aisle', 4, 'aisle', 2]);
    renderSeats('seats-room-2', 5, [3, 'aisle', 3]);
    renderSeats('seats-room-3', 4, [5]);

    function openModal(cardElement) {
        const roomId = cardElement.getAttribute('data-room-id');
        const roomName = cardElement.getAttribute('data-room-name');

        document.getElementById('selectedRoomId').value = roomId;
        document.getElementById('modalTitle').innerText = `Új előadás felvétele – ${roomName}`;

        // Alapértelmezett dátum: mai nap 18:00
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('startTimeInput').value = `${yyyy}-${mm}-${dd}T18:00`;

        if (!modalInstance) {
            modalInstance = new bootstrap.Modal(document.getElementById('addPlayModal'));
        }
        modalInstance.show();
    }
</script>
</body>
</html>
