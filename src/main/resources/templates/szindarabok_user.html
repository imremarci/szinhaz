<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zsiráf Színház - Színdarabok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">    
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        
        <!-- BAL OLDALI MENÜ -->
        <div class="col-12 col-md-3 col-lg-2">
            <div class="sidebar">
                <h1>Zsiráf Színház</h1>
                <div class="sidebar-menu mt-4">
                    <h2 th:onclick="|window.location.href='@{/fooldal}'|">Főoldal</h2>
                    <h2 class="active" th:onclick="|window.location.href='@{/darabok}'|">Színdarabok</h2>
                    <h2 th:onclick="|window.location.href='@{/szineszek}'|">Színészek</h2>
                    <h2 th:onclick="|window.location.href='@{/eloadasok}'|">Előadások</h2>
                </div>
            </div>
        </div>

        <!-- JOBB OLDALI FŐ TARTALOM (Offset pótolva!) -->
        <div class="col-12 col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            
            <div class="top-bar">
                <h3 class="page-title">Műsoron lévő darabjaink</h3>
            </div>

            <div class="px-4 pb-5">
                
                <!-- THYMELEAF CIKLUS A BACKENDBŐL -->
                <div class="play-card-item" th:each="play : ${plays}">
                    <img th:src="${play.coverImageUrl}" src="https://images.unsplash.com/photo-1585699324551-f6c309eedeca?q=80&w=250&h=300&fit=crop" class="play-image" alt="Borítókép">
                    
                    <div class="play-content">
                        <h2 class="play-title" th:text="${play.title}">Hamlet</h2>
                        <p class="play-desc">
                            <span th:text="${play.description}">Leírás...</span>
                            <a th:href="@{/darabok/{id}(id=${play.id})}" class="read-more">... és tovább</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
